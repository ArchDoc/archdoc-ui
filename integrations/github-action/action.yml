name: ArchDoc architectural impact
description: Comments on a pull request with its architectural impact (journeys, actors, owners, model changes, drift) and fails on drift it introduces.
author: ArchDoc
branding:
  icon: layers
  color: blue

inputs:
  base:
    description: Branch or commit to compare with. Defaults to the pull request's base commit.
    default: ${{ github.event.pull_request.base.sha }}
  model:
    description: Repository, .archdoc directory, or model file.
    default: "."
  fail-on:
    description: Fail when the pull request introduces findings at this severity or above. error, warning, or never.
    default: error
  comment:
    description: Post the report as a pull request comment, updated on every run. true, false, or quiet (post only when the pull request changes the architecture; an earlier comment is still updated).
    default: quiet
  annotations:
    description: Put the findings the pull request introduces on the lines they're about, in Files changed. true or false.
    default: "true"
  explorer-url:
    description: A page that shows this change in the explorer, linked from the comment, such as where you deploy the site output.
    default: ""
  site:
    description: Also write the explorer as a static site, opened on this change, to the directory in the site output. true or false.
    default: "false"
  command:
    description: How to run ArchDoc. Use node path/to/cli/dist/bin.js to run a local build.
    default: npx -y @archdoc/cli
  github-token:
    description: Token for posting the comment.
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the markdown report.
    value: ${{ steps.report.outputs.path }}
  verdict:
    description: blocking, attention, info, or none.
    value: ${{ steps.report.outputs.verdict }}
  site:
    description: With site true, the directory the explorer was written to.
    value: ${{ steps.site.outputs.path }}

runs:
  using: composite
  steps:
    - name: Report the architectural impact
      id: report
      shell: bash
      env:
        ARCHDOC: ${{ inputs.command }}
        BASE: ${{ inputs.base }}
        MODEL: ${{ inputs.model }}
        EXPLORER_URL: ${{ inputs.explorer-url }}
      run: |
        set -euo pipefail
        if [ -z "$BASE" ]; then
          echo "::error::No base to compare with. Set the base input, or run on pull_request events."
          exit 1
        fi
        if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          echo "::error::Base $BASE isn't in the checkout. Use actions/checkout with fetch-depth: 0."
          exit 1
        fi
        out="$RUNNER_TEMP/archdoc-report.md"
        args=(report --base "$BASE" --model "$MODEL")
        if [ -n "$EXPLORER_URL" ]; then args+=(--explorer-url "$EXPLORER_URL"); fi
        $ARCHDOC "${args[@]}" > "$out"
        cat "$out" >> "$GITHUB_STEP_SUMMARY"
        verdict=$(sed -n 's/^<!-- archdoc-verdict: \([a-z]*\) -->$/\1/p' "$out" | tail -1)
        echo "path=$out" >> "$GITHUB_OUTPUT"
        echo "verdict=${verdict:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Write the explorer for this change
      id: site
      if: inputs.site == 'true'
      shell: bash
      env:
        ARCHDOC: ${{ inputs.command }}
        BASE: ${{ inputs.base }}
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/archdoc-site"
        $ARCHDOC site "$MODEL" --base "$BASE" --out "$dir"
        echo "path=$dir" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: inputs.comment != 'false' && github.event.pull_request
      # Pull requests from forks get a read-only token; the job summary still has the report.
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        REPORT: ${{ steps.report.outputs.path }}
        VERDICT: ${{ steps.report.outputs.verdict }}
        QUIET: ${{ inputs.comment == 'quiet' }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("node:fs");
          let body = fs.readFileSync(process.env.REPORT, "utf8");
          const marker = "<!-- archdoc-report -->";
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const previous = comments.find((c) => c.body?.startsWith(marker));
          if (!previous && process.env.QUIET === "true" && process.env.VERDICT === "none") {
            core.info("No architectural impact, so no comment.");
            return;
          }
          if (previous) {
            // Keep the boxes reviewers already ticked in "Before merging".
            const ticked = new Set(
              (previous.body.match(/^- \[x\] .*$/gm) ?? []).map((l) => l.slice(6)),
            );
            body = body.replace(/^- \[ \] (.*)$/gm, (line, rest) =>
              ticked.has(rest) ? `- [x] ${rest}` : line,
            );
            if (previous.body === body) return;
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on drift this change introduced
      shell: bash
      env:
        ARCHDOC: ${{ inputs.command }}
        BASE: ${{ inputs.base }}
        MODEL: ${{ inputs.model }}
        FAIL_ON: ${{ inputs.fail-on }}
        FORMAT: ${{ inputs.annotations == 'true' && 'github' || 'text' }}
      run: $ARCHDOC check --base "$BASE" --model "$MODEL" --fail-on "$FAIL_ON" --format "$FORMAT"
