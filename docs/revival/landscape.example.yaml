# Illustrative only: proposed ArchDoc spec v2 federation (see 03-target-architecture.md §3.8).
# A fictional company, Acme Rides, with four product repos and one landscape repo.
# Each YAML document below is a different file in a different repo.
# Every journey step follows a declared `uses` relationship, which `archdoc check` would enforce.
# acme/trips and acme/support-tools aren't shown. Assume they declare trips.api, support.admin-console,
# and the relationships the journeys rely on.
# Team names in `owners` (payments-team, rides-team) resolve against the landscape's shared actors.
# Locally an unresolved team is a warning; in `archdoc landscape build` it's an error.

# ─────────────────────────────────────────────────────────────────────────
# repo: acme/payments   file: .archdoc/archdoc.yaml
# Owns the "payments" namespace. Publishes payments@5.x on each release.
# ─────────────────────────────────────────────────────────────────────────
archdoc: "2.0"
namespace: payments
name: Payments
elements:
  charges:
    kind: container
    technology: Go, gRPC
    owners: [payments-team]
    code: [{ path: services/charges/** }]
    provides:
      - api: proto/charges.proto
    uses:
      ledger: Records every charge and refund
  ledger:
    kind: datastore
    technology: Postgres
    owners: [payments-team]
  ledger-reports:
    kind: container
    description: Month-end reporting UI over the ledger.
    owners: [payments-team]
    code: [{ path: apps/reports/** }]
    uses:
      ledger: Reads posted entries
rules:
  - id: payments-boundary
    description: Only the rides gateway and support console may call charges.
    allow-only: { to: charges, from: [rides.api-gateway, support.admin-console] }

---
# ─────────────────────────────────────────────────────────────────────────
# repo: acme/rides   file: .archdoc/archdoc.yaml
# Owns "rides". Imports the namespaces it depends on, pinned in archdoc.lock.
# ─────────────────────────────────────────────────────────────────────────
archdoc: "2.0"
namespace: rides
name: Rides
imports:
  trips:    { github: acme/trips,    version: ^3 }
  payments: { github: acme/payments, version: ^5 }
actors:
  passenger:
    kind: person
    description: Books and pays for rides.
    uses:
      mobile-app: Requests rides, pays, rates drivers
  driver:
    kind: person
    description: Accepts and completes trips.
    uses:
      mobile-app: Goes online, accepts trips
elements:
  mobile-app:
    kind: container
    technology: React Native
    owners: [rides-team]
    code: [{ path: apps/mobile/** }]
    uses:
      api-gateway: Calls all backend APIs
  api-gateway:
    kind: container
    technology: Node.js / Fastify
    owners: [rides-team]
    code: [{ path: services/gateway/** }]
    uses:
      trips.api: Creates trips and matches drivers
      payments.charges: { description: Pre-authorizes and captures fares, technology: gRPC }
journeys:
  book-a-ride:
    actor: passenger
    goal: Get a ride to a destination
    importance: critical
    steps:
      - { from: passenger, to: mobile-app, action: Confirms pickup and destination }
      - { from: mobile-app, to: api-gateway, action: POST /trips, code: services/gateway/src/routes/trips.ts }
      - { from: api-gateway, to: trips.api, action: Create trip and match a driver }
      - { from: api-gateway, to: payments.charges, action: Pre-authorize the fare }

---
# ─────────────────────────────────────────────────────────────────────────
# repo: acme/architecture   file: .archdoc/landscape.yaml
# The landscape: composes every namespace and adds what no single team owns.
# `archdoc landscape build` turns this into the enterprise explorer site.
# ─────────────────────────────────────────────────────────────────────────
archdoc: "2.0"
landscape: Acme Rides
imports:
  rides:    { github: acme/rides,         version: ^7 }
  trips:    { github: acme/trips,         version: ^3 }
  payments: { github: acme/payments,      version: ^5 }
  support:  { github: acme/support-tools, version: ^2 }
  zendesk:  { file: vendors/zendesk.yaml }            # external SaaS described as a stub

domains:                                               # business capabilities for grouping
  mobility: [rides, trips]
  money: [payments]
  customer-care: [support, zendesk]

actors:                                                # enterprise-wide teams, usable by every repo
  rides-team:    { kind: team, members: ["@acme/rides"] }
  payments-team: { kind: team, members: ["@acme/payments"] }
  support-team:
    kind: team
    description: Resolves rider and driver issues.
    members: ["@acme/support"]
    uses:
      support.admin-console: Looks up trips and issues refunds
      zendesk.ticketing: Works the ticket queue
  finance-team:
    kind: team
    members: ["@acme/finance"]
    uses:
      payments.ledger-reports: Runs month-end close

journeys:                                              # cross-team journeys live here
  refund-a-fare:
    actor: support-team
    goal: Refund a rider who was overcharged
    importance: high
    steps:
      - { from: support-team, to: zendesk.ticketing, action: Picks up the complaint }
      - { from: support-team, to: support.admin-console, action: Finds the trip }
      - { from: support.admin-console, to: trips.api, action: Loads trip and fare details }
      - { from: support.admin-console, to: payments.charges, action: Issues a partial refund }
      - { from: payments.charges, to: payments.ledger, action: Posts the refund entry }
  month-end-close:
    actor: finance-team
    goal: Reconcile all charges and refunds for the month
    importance: high
    steps:
      - { from: finance-team, to: payments.ledger-reports, action: Runs the reconciliation report }
      - { from: payments.ledger-reports, to: payments.ledger, action: Reads posted entries }

rules:                                                 # org-wide rules apply to every namespace
  - id: critical-journeys-reviewed
    description: Changes that touch a critical journey need review from the journey owner's team.
    require-review: { journeys: { importance: critical } }
  - id: no-shared-databases
    description: A datastore is only used by elements in its own namespace.
    deny: { from: { namespace: "!same" }, to: { kind: datastore } }
