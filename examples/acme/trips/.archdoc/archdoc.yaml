archdoc: "2.0"
namespace: trips
name: Trips
description: Records every trip and what the rider paid for it.

imports:
  payments: { git: ../payments, version: ^5 }

actors:
  trips-team: { kind: team }

elements:
  trips-api:
    kind: container
    technology: Kotlin
    owners: [trips-team]
    code: services/trips/**
    provides:
      - { api: openapi/trips.yaml, description: Look up trips and their fares, returns: Trip }
    uses:
      trips-db: { description: Reads and writes trips, sends: Trip }
      payments.charges:
        description: Marks the trip refunded when a refund is issued
        via: refund.issued
  trips-db:
    kind: datastore
    technology: Postgres
    owners: [trips-team]
    stores:
      trips: { entity: Trip, key: id }

data:
  Trip:
    kind: entity
    owners: [trips-team]
    source: { sql: migrations#trips }
    fields:
      id: {}
      rider_id: {}
      rider_email: { classification: pii }
      fare_cents: {}
      refunded_cents: {}
      status: {}
    states:
      - requested -> completed -> refunded

mappings:
  refund-marks-trip:
    description: When payments issues a refund, the trip records how much was refunded.
    from: { issued: payments.RefundIssued }
    to: trips-db.trips
    code: services/trips/refunds/listener.kt
    fields:
      refunded_cents: issued.amount_cents
