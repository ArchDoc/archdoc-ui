archdoc: "2.0"
namespace: trips
name: Trips
description: Records every trip and what the rider paid for it.

imports:
  payments: { git: ../payments, version: ^5 }

actors:
  trips-team: { kind: team }

elements:
  trips-api:
    kind: container
    technology: Kotlin
    owners: [trips-team]
    code: services/trips/**
    provides:
      - { api: openapi/trips.yaml, description: Look up trips and their fares, returns: Trip }
    uses:
      trips-db: { description: Reads and writes trips, sends: Trip }
      payments.charges:
        description: Marks the trip refunded when a refund is issued
        via: refund.issued
  trips-db:
    kind: datastore
    technology: Postgres
    owners: [trips-team]
    stores:
      trips: { entity: Trip, key: id }

data:
  Trip:
    kind: entity
    owners: [trips-team]
    fields:
      id: { type: uuid }
      rider_id: { type: uuid }
      rider_email: { type: string, classification: pii }
      fare_cents: { type: int }
      status: { type: enum, values: [requested, completed, refunded] }
    states:
      - requested -> completed -> refunded
