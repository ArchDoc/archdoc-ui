archdoc: "2.0"
namespace: rides
name: Rides
description: The rider app and the gateway behind it.

imports:
  payments: { git: ../payments, version: ^5 }
  trips: { git: ../trips, version: ^3 }

actors:
  rides-team: { kind: team }
  rider:
    kind: person
    uses:
      app: Requests rides and refunds

elements:
  app:
    kind: container
    technology: React Native
    tags: [app]
    owners: [rides-team]
    code: apps/rider/**
    uses:
      api-gateway: { description: Calls, sends: payments.RefundRequest }
  api-gateway:
    kind: container
    technology: Node.js
    owners: [rides-team]
    code: services/gateway/**
    uses:
      trips.trips-api:
        description: Looks up the trip
        via: openapi/trips.yaml
      payments.charges:
        description: Asks for a refund
        via: proto/charges.proto

journeys:
  request-refund:
    actor: rider
    goal: Get money back for a bad trip
    importance: critical
    steps:
      - { from: rider, to: app, action: Taps "Report a problem" on the trip }
      - { from: app, to: api-gateway, action: Sends the refund request, sends: payments.RefundRequest }
      - { from: api-gateway, to: trips.trips-api, action: Checks the trip and its fare }
      - from: api-gateway
        to: payments.charges
        action: Asks for a refund
        sends: payments.RefundRequest
        via: payments.request-to-refund
        decides: payments.refund-approval
        branches:
          auto-approve:
            creates: { payments.Refund: { status: approved } }
            changes: { payments.Charge.status: captured -> partially_refunded }
          needs-finance-approval:
            creates: { payments.Refund: { status: pending_approval } }
          escalate-to-safety:
            creates: { payments.Refund: { status: pending_approval } }
      - { from: payments.charges, to: payments.ledger, action: Records the refund, when: auto-approve, via: payments.refund-to-ledger, sends: payments.LedgerEntry }
      - { from: payments.charges, to: trips.trips-api, action: Publishes refund.issued, when: auto-approve, via: payments.refund-issued, sends: payments.RefundIssued }
      - { from: trips.trips-api, to: trips.trips-db, action: Marks the trip refunded, when: auto-approve, via: trips.refund-marks-trip, changes: { trips.Trip.status: completed -> refunded } }
