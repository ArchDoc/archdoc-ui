# Insurance: motor claims. A policyholder reports an accident, photos are
# assessed, the claim is adjudicated (paid straight away, sent to an
# adjuster, or referred for fraud review), and the payout goes to their bank.
# Exercises a decision with several inputs, a hand-off journey (next), and
# bank details (pii, pci-like) kept away from analytics.
archdoc: "2.0"
namespace: claims
name: Motor claims
description: From first notice of loss to payout.

actors:
  policyholder:
    kind: person
    uses:
      claims-app: { description: Reports and follows a claim, sends: LossReport }
  adjuster:
    kind: role
    description: Reviews claims the rules don't settle on their own.
    uses:
      adjuster-workbench: { description: Approves or adjusts claims, sends: AdjusterDecision }
  claims-team: { kind: team }
  analytics-team: { kind: team }

elements:
  claims-app:
    kind: container
    technology: Flutter
    owners: [claims-team]
    tags: [app]
    uses:
      fnol: { description: Files the claim and uploads photos, sends: [LossReport, Photo] }
  fnol:
    kind: container
    technology: C#, .NET
    owners: [claims-team]
    description: First notice of loss.
    provides:
      - { api: openapi/fnol.yaml, accepts: [LossReport, Photo], returns: Claim }
    uses:
      policy-admin: { description: Checks the policy covers the car and the date, sends: CoverageQuery }
      claims-db: { description: Opens the claim, sends: Claim }
      photo-store: { description: Keeps photos of the damage, sends: Photo }
      damage-ai: { description: Estimates repair cost from photos, sends: Photo }
      adjudication: { description: Asks for a decision, sends: Claim }
  photo-store:
    kind: datastore
    technology: S3
    owners: [claims-team]
    stores:
      photos: { entity: Photo, key: id, retention: 7y }
  damage-ai:
    kind: external
    description: A vendor model that estimates repair costs from photos.
  policy-admin:
    kind: container
    technology: Guidewire
    owners: [claims-team]
    provides:
      - { api: soap/policy, accepts: CoverageQuery, returns: Policy }
  adjudication:
    kind: container
    technology: Drools
    owners: [claims-team]
    uses:
      claims-db: { description: Records the decision, sends: Claim }
      payments: { description: Pays approved claims, sends: Payout }
  adjuster-workbench:
    kind: container
    technology: Angular
    owners: [claims-team]
    tags: [app]
    uses:
      adjudication: { description: Records the adjuster's decision, sends: AdjusterDecision }
  payments:
    kind: container
    technology: Java
    owners: [claims-team]
    uses:
      bank-rails: { description: Sends the transfer, sends: Transfer }
      claims-db: { description: Marks the claim paid, sends: Claim }
  bank-rails:
    kind: external
    description: The faster-payments scheme.
  claims-db:
    kind: datastore
    technology: Oracle
    owners: [claims-team]
    stores:
      claims: { entity: Claim, key: id, retention: 10y }
      policies: { entity: Policy, key: number }
  warehouse:
    kind: container
    technology: Snowflake
    owners: [analytics-team]
    description: Loss ratios and fraud trends.
    uses:
      claims-db: { description: Copies claims nightly, sends: ClaimFacts }

data:
  Policy:
    kind: entity
    fields:
      number: { type: string }
      holder_name: { type: string, classification: pii }
      vehicle_reg: { type: string, classification: pii }
      excess_cents: { type: int }
      active: { type: bool }
  LossReport:
    kind: message
    fields:
      policy_number: { type: string, references: Policy }
      happened_at: { type: timestamp }
      description: { type: string }
      bank_account: { type: string, classification: financial }
  CoverageQuery:
    kind: message
    fields:
      policy_number: { type: string, references: Policy }
      happened_at: { type: timestamp }
  Photo:
    kind: entity
    fields:
      id: { type: uuid }
      claim_id: { type: uuid, references: Claim }
      url: { type: string }
  Claim:
    kind: entity
    fields:
      id: { type: uuid }
      policy_number: { type: string, references: Policy }
      estimate_cents: { type: int }
      fraud_score: { type: number }
      bank_account: { type: string, classification: financial }
      status:
        type: enum
        values: [open, approved, in_review, fraud_review, paid, declined]
    states:
      - open -> approved | in_review | fraud_review | declined
      - in_review -> approved | declined
      - fraud_review -> in_review | declined
      - approved -> paid
  AdjusterDecision:
    kind: message
    fields:
      claim_id: { type: uuid, references: Claim }
      approve: { type: bool }
      estimate_cents: { type: int }
  Payout:
    kind: message
    fields:
      claim_id: { type: uuid, references: Claim }
      amount_cents: { type: int }
      bank_account: { type: string, classification: financial }
  Transfer:
    kind: message
    fields:
      amount_cents: { type: int }
      bank_account: { type: string, classification: financial }
      reference: { type: string }
  ClaimFacts:
    kind: message
    description: For trends. No names, registrations, or bank details.
    fields:
      claim_id: { type: uuid }
      estimate_cents: { type: int }
      fraud_score: { type: number }
      status: { type: string }

logic:
  adjudicate:
    description: Small, clean claims on active policies pay out at once.
    runs-in: adjudication
    input: { claim: Claim, policy: Policy }
    rules:
      - when: "!policy.active"
        then: decline
      - when: "claim.fraud_score >= 0.7"
        then: fraud-review
      - when: "claim.estimate_cents <= 250000"
        then: straight-through
      - else: adjuster-review

mappings:
  report-to-claim:
    from: { report: LossReport }
    to: claims-db.claims
    fields:
      id: "'claim-' + report.policy_number"
      policy_number: report.policy_number
      bank_account: report.bank_account
      status: "'open'"
  claim-to-payout:
    from: { claim: Claim, policy: Policy }
    to: Payout
    fields:
      claim_id: claim.id
      amount_cents: claim.estimate_cents - policy.excess_cents
      bank_account: claim.bank_account

journeys:
  report-a-claim:
    actor: policyholder
    goal: Get the car repaired after an accident
    importance: critical
    steps:
      - { from: policyholder, to: claims-app, action: Reports the accident }
      - { from: claims-app, to: fnol, action: Files the claim, via: report-to-claim }
      - { from: fnol, to: photo-store, action: Stores the photos }
      - { from: fnol, to: policy-admin, action: Checks cover }
      - { from: fnol, to: damage-ai, action: Gets a repair estimate }
      - from: fnol
        to: adjudication
        action: Asks for a decision
        decides: adjudicate
        branches:
          straight-through: { changes: { Claim.status: open -> approved } }
          adjuster-review:
            changes: { Claim.status: open -> in_review }
            next: adjuster-review
          fraud-review: { changes: { Claim.status: open -> fraud_review } }
          decline: { changes: { Claim.status: open -> declined } }
      - { from: adjudication, to: payments, action: Pays out, when: straight-through, via: claim-to-payout }
      - { from: payments, to: bank-rails, action: Sends the transfer, when: straight-through }
      - { from: payments, to: claims-db, action: Marks it paid, when: straight-through, changes: { Claim.status: approved -> paid } }
  adjuster-review:
    actor: adjuster
    goal: Settle a claim the rules couldn't
    importance: high
    steps:
      - { from: adjuster, to: adjuster-workbench, action: Reviews photos and the estimate }
      - { from: adjuster-workbench, to: adjudication, action: Approves an adjusted amount }
      - { from: adjudication, to: claims-db, action: Records it, changes: { Claim.status: in_review -> approved } }

rules:
  - id: apps-go-through-services
    deny: { from: { tag: app }, to: { kind: datastore } }
  - id: bank-details-stay-out-of-analytics
    description: Bank details never reach the warehouse.
    data: { classification: financial, not-sent-to: warehouse }
  - id: only-payments-moves-money
    allow-only: { to: bank-rails, from: [payments] }
