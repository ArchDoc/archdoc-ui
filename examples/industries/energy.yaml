# Energy: an electricity utility. Smart meters send readings every 15
# minutes; they're validated, stored as a time series, billed monthly, and
# watched for outages. Exercises device telemetry through a queue, a
# decision on whether a gap is an outage, a bill computed by a mapping, and
# fine-grained readings treated as personal data.
archdoc: "2.0"
namespace: grid
name: Electricity utility
description: Meters, outages, and bills.

actors:
  customer:
    kind: person
    uses:
      customer-portal: { description: Sees usage and pays bills, sends: UsageQuery }
  control-room:
    kind: role
    description: Dispatches crews to outages.
    uses:
      outage-board: { description: Watches and dispatches outages, sends: Dispatch }
  metering-team: { kind: team }
  billing-team: { kind: team }

elements:
  smart-meters:
    kind: external
    description: Two million meters on a cellular network. Each sends a reading every 15 minutes.
    uses:
      head-end: { description: Sends readings, sends: RawReading }
  head-end:
    kind: container
    technology: Vendor head-end system
    owners: [metering-team]
    provides:
      - { api: dlms/readings, accepts: RawReading }
    uses:
      readings-queue: { description: Publishes readings, sends: MeterReading }
  readings-queue:
    kind: queue
    technology: Kafka
    owners: [metering-team]
    provides:
      - { topic: meter-readings, carries: MeterReading }
  mdm:
    kind: container
    technology: Scala, Flink
    owners: [metering-team]
    description: Meter data management. Validates readings, estimates gaps, and spots outages.
    uses:
      readings-queue: { description: Consumes readings, via: meter-readings }
      timeseries-db: { description: Stores validated readings, sends: MeterReading }
      outage-board: { description: Raises outages, sends: OutageAlert }
  timeseries-db:
    kind: datastore
    technology: TimescaleDB
    owners: [metering-team]
    stores:
      readings: { entity: MeterReading, key: id, retention: 3y }
      meters: { entity: Meter, key: id }
  outage-board:
    kind: container
    technology: React, WebSockets
    owners: [metering-team]
    tags: [app]
    uses:
      crew-dispatch: { description: Sends a crew, sends: Dispatch }
  crew-dispatch:
    kind: external
    description: The field workforce system.
  billing:
    kind: container
    technology: SAP IS-U
    owners: [billing-team]
    uses:
      timeseries-db: { description: Totals a month of readings, sends: MeterReading }
      billing-db: { description: Issues bills, sends: Bill }
  billing-db:
    kind: datastore
    technology: Oracle
    owners: [billing-team]
    stores:
      accounts: { entity: Account, key: id }
      bills: { entity: Bill, key: id, retention: 7y }
  customer-portal:
    kind: container
    technology: Vue
    owners: [billing-team]
    tags: [app]
    uses:
      usage-api: { description: Shows usage and bills, sends: UsageQuery }
  usage-api:
    kind: container
    technology: Node.js
    owners: [billing-team]
    provides:
      - { api: openapi/usage.yaml, accepts: UsageQuery, returns: UsageSummary }
    uses:
      timeseries-db: { description: Reads daily totals, sends: MeterReading }
      billing-db: { description: Reads bills, sends: Bill }
  marketing:
    kind: container
    status: deprecated
    owners: [billing-team]
    description: Old campaign tool, being retired. Gets monthly totals only.
    uses:
      billing-db: { description: Reads monthly totals, sends: MonthlyTotal }

data:
  Meter:
    kind: entity
    fields:
      id: { type: string }
      account_id: { type: uuid, references: Account }
      feeder: { type: string }
  Account:
    kind: entity
    fields:
      id: { type: uuid }
      holder_name: { type: string, classification: pii }
      address: { type: string, classification: pii }
      tariff_pence_per_kwh: { type: number }
      standing_charge_pence: { type: int }
  RawReading:
    kind: message
    fields:
      meter_id: { type: string, references: Meter }
      register_wh: { type: int }
      at: { type: timestamp }
  MeterReading:
    kind: entity
    description: Fifteen-minute readings show when someone is home, so they're personal data.
    fields:
      id: { type: string }
      meter_id: { type: string, references: Meter }
      kwh: { type: number, classification: pii }
      at: { type: timestamp }
      quality: { type: enum, values: [actual, estimated, missing] }
  OutageAlert:
    kind: event
    fields:
      feeder: { type: string }
      meters_dark: { type: int }
      since: { type: timestamp }
  Dispatch:
    kind: message
    fields:
      feeder: { type: string }
      priority: { type: enum, values: [p1, p2, p3] }
  Bill:
    kind: entity
    fields:
      id: { type: uuid }
      account_id: { type: uuid, references: Account }
      kwh: { type: number }
      amount_pence: { type: int }
      status: { type: enum, values: [draft, issued, paid, overdue] }
    states:
      - draft -> issued
      - issued -> paid | overdue
      - overdue -> paid
  MonthlyTotal:
    kind: message
    fields:
      account_id: { type: uuid }
      kwh: { type: number }
  UsageQuery:
    kind: message
    fields:
      account_id: { type: uuid, references: Account }
      from: { type: date }
      to: { type: date }
  UsageSummary:
    kind: message
    fields:
      daily_kwh: { type: json }
      latest_bill_pence: { type: int }
  Gap:
    kind: message
    description: What the outage check sees about a feeder.
    fields:
      meters_silent: { type: int }
      meters_on_feeder: { type: int }
      minutes_silent: { type: int }

logic:
  outage-check:
    description: Many meters on one feeder going quiet together is an outage; a few is a network blip.
    runs-in: mdm
    input: { gap: Gap }
    rules:
      - when: "gap.meters_silent * 10 >= gap.meters_on_feeder && gap.minutes_silent >= 30"
        then: outage
      - when: "gap.minutes_silent >= 45"
        then: estimate
      - else: wait

mappings:
  raw-to-reading:
    from: { raw: RawReading }
    to: MeterReading
    fields:
      id: "raw.meter_id + '@' + string(raw.at)"
      meter_id: raw.meter_id
      kwh: double(raw.register_wh) / 1000.0
      at: raw.at
      quality: "'actual'"
  month-to-bill:
    description: Units at the tariff, plus the standing charge.
    from: { account: Account, month: MonthlyTotal }
    to: billing-db.bills
    fields:
      id: "'bill-' + string(account.id)"
      account_id: account.id
      kwh: month.kwh
      amount_pence: int(month.kwh * account.tariff_pence_per_kwh) + account.standing_charge_pence
      status: "'draft'"

journeys:
  reading-to-outage:
    actor: control-room
    goal: Get a crew out when a street loses power
    importance: critical
    steps:
      - { from: smart-meters, to: head-end, action: Send their 15-minute readings }
      - { from: head-end, to: readings-queue, action: Publishes them }
      - { from: mdm, to: readings-queue, action: Consumes them }
      - { from: mdm, to: timeseries-db, action: Validates and stores them, via: raw-to-reading }
      - from: mdm
        to: outage-board
        action: Checks the feeder for silent meters
        decides: outage-check
        branches:
          outage: { description: Raises an outage }
          estimate: { description: Fills the gap with estimates }
          wait: { description: Waits for late readings }
      - { from: control-room, to: outage-board, action: Sees the outage on the map, when: outage }
      - { from: outage-board, to: crew-dispatch, action: Sends a crew, when: outage }
  monthly-bill:
    actor: customer
    goal: Get an accurate bill
    importance: high
    steps:
      - { from: billing, to: timeseries-db, action: Totals the month's readings }
      - from: billing
        to: billing-db
        action: Issues the bill
        via: month-to-bill
        changes: { Bill.status: draft -> issued }
      - { from: customer, to: customer-portal, action: Opens the bill }
      - { from: customer-portal, to: usage-api, action: Loads usage and the bill }

rules:
  - id: apps-go-through-services
    deny: { from: { tag: app }, to: { kind: datastore } }
  - id: no-readings-to-marketing
    description: Marketing gets monthly totals, never the 15-minute readings.
    data: { classification: pii, not-sent-to: marketing }
