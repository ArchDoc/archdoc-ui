# E-commerce: an online store. Shoppers fill a cart and check out; stock is
# reserved, the card is charged by a payment provider, and an order event
# starts fulfilment. Exercises a cart that becomes an order through a
# mapping, an order lifecycle, events on a topic, and a planned service.
archdoc: "2.0"
namespace: shop
name: Online store
description: Browse, check out, and get your order shipped.

actors:
  shopper:
    kind: person
    uses:
      storefront: { description: Browses and checks out, sends: CartUpdate }
  merchandiser:
    kind: role
    uses:
      back-office: { description: Edits products and prices, sends: ProductUpdate }
  storefront-team: { kind: team }
  fulfilment-team: { kind: team }

elements:
  storefront:
    kind: container
    technology: Next.js
    owners: [storefront-team]
    tags: [app]
    uses:
      catalog: { description: Lists products, sends: ProductQuery }
      cart: { description: Adds to the cart, sends: CartUpdate }
      checkout: { description: Places the order, sends: CheckoutRequest }
  catalog:
    kind: container
    technology: Node.js, Elasticsearch
    owners: [storefront-team]
    provides:
      - { api: openapi/catalog.yaml, accepts: [ProductQuery, ProductUpdate], returns: Product }
    uses:
      shop-db: { description: Reads products, sends: Product }
  cart:
    kind: container
    technology: Node.js
    owners: [storefront-team]
    uses:
      cart-cache: { description: Keeps carts for 30 days, sends: Cart }
  cart-cache:
    kind: datastore
    technology: Redis
    owners: [storefront-team]
    stores:
      carts: { entity: Cart, key: id, retention: 30d }
  checkout:
    kind: container
    technology: Go
    owners: [storefront-team]
    provides:
      - { api: openapi/checkout.yaml, accepts: CheckoutRequest, returns: Order }
      - { topic: orders, carries: OrderPlaced }
    uses:
      cart-cache: { description: Reads the cart, sends: Cart }
      inventory: { description: Reserves stock, sends: Reservation }
      payment-provider: { description: Charges the card, sends: PaymentIntent }
      shop-db: { description: Saves the order, sends: Order }
  inventory:
    kind: container
    technology: Java
    owners: [fulfilment-team]
    uses:
      shop-db: { description: Decrements stock, sends: StockLevel }
  payment-provider:
    kind: external
    description: Stripe. Card details go straight from the browser to it.
  shop-db:
    kind: datastore
    technology: Postgres
    stores:
      products: { entity: Product, key: sku }
      stock: { entity: StockLevel, key: sku }
      orders: { entity: Order, key: id }
      customers: { entity: Customer, key: id }
  warehouse:
    kind: container
    technology: Python
    owners: [fulfilment-team]
    uses:
      checkout: { description: Subscribes to new orders, via: orders }
      shop-db: { description: Marks orders shipped, sends: Order }
      carrier: { description: Books a shipment, sends: ShipmentBooking }
  carrier:
    kind: external
    description: A parcel carrier's booking API.
  back-office:
    kind: container
    technology: Rails
    owners: [storefront-team]
    tags: [app]
    uses:
      catalog: { description: Updates products, sends: ProductUpdate }
  recommendations:
    kind: container
    status: planned
    description: Suggests products from order history.
    uses:
      checkout: { description: Learns from orders, via: orders }

data:
  Customer:
    kind: entity
    fields:
      id: { type: uuid }
      email: { type: string, classification: pii }
      shipping_address: { type: string, classification: pii }
  Product:
    kind: entity
    fields:
      sku: { type: string }
      name: { type: string }
      price_cents: { type: int }
  ProductQuery:
    kind: message
    fields:
      text: { type: string }
      category: { type: string }
  ProductUpdate:
    kind: message
    fields:
      sku: { type: string, references: Product }
      price_cents: { type: int }
  StockLevel:
    kind: entity
    fields:
      sku: { type: string, references: Product }
      on_hand: { type: int }
      reserved: { type: int }
  Cart:
    kind: entity
    fields:
      id: { type: uuid }
      customer_id: { type: uuid, references: Customer }
      total_cents: { type: int }
      items: { type: json }
  CartUpdate:
    kind: message
    fields:
      cart_id: { type: uuid, references: Cart }
      sku: { type: string, references: Product }
      quantity: { type: int }
  CheckoutRequest:
    kind: message
    fields:
      cart_id: { type: uuid, references: Cart }
      shipping_address: { type: string, classification: pii }
      payment_method: { type: string, description: "A provider token, never a card number" }
  Reservation:
    kind: message
    fields:
      order_id: { type: uuid, references: Order }
      items: { type: json }
  PaymentIntent:
    kind: message
    description: An amount and the provider's token. No address or email.
    fields:
      amount_cents: { type: int }
      payment_method: { type: string }
  Order:
    kind: entity
    fields:
      id: { type: uuid }
      customer_id: { type: uuid, references: Customer }
      total_cents: { type: int }
      shipping_address: { type: string, classification: pii }
      status: { type: enum, values: [placed, paid, shipped, delivered, cancelled] }
    states:
      - placed -> paid | cancelled
      - paid -> shipped | cancelled
      - shipped -> delivered
  OrderPlaced:
    kind: event
    fields:
      order_id: { type: uuid, references: Order }
      total_cents: { type: int }
  ShipmentBooking:
    kind: message
    fields:
      order_id: { type: uuid, references: Order }
      shipping_address: { type: string, classification: pii }

mappings:
  cart-to-order:
    description: An order is the cart as it was at checkout.
    from: { cart: Cart, request: CheckoutRequest }
    to: shop-db.orders
    fields:
      id: "'order-' + cart.id"
      customer_id: cart.customer_id
      total_cents: cart.total_cents
      shipping_address: request.shipping_address
      status: "'placed'"
  order-to-payment:
    from: { order: Order, request: CheckoutRequest }
    to: PaymentIntent
    fields:
      amount_cents: order.total_cents
      payment_method: request.payment_method

journeys:
  check-out:
    actor: shopper
    goal: Buy what's in the cart
    importance: critical
    steps:
      - { from: shopper, to: storefront, action: Clicks "Place order" }
      - { from: storefront, to: checkout, action: Sends the cart and address }
      - { from: checkout, to: cart-cache, action: Reads the cart }
      - { from: checkout, to: shop-db, action: Creates the order, via: cart-to-order }
      - { from: checkout, to: inventory, action: Reserves the items }
      - { from: checkout, to: payment-provider, action: Charges the card, via: order-to-payment }
      - from: checkout
        to: shop-db
        action: Marks the order paid
        changes: { Order.status: placed -> paid }
  ship-order:
    actor: shopper
    goal: Get the order delivered
    importance: high
    steps:
      - { from: warehouse, to: checkout, action: Hears about the paid order }
      - { from: warehouse, to: carrier, action: Books the parcel }
      - { from: warehouse, to: shop-db, action: Marks it shipped, changes: { Order.status: paid -> shipped } }
  change-a-price:
    actor: merchandiser
    goal: Put a product on sale
    steps:
      - { from: merchandiser, to: back-office, action: Edits the price }
      - { from: back-office, to: catalog, action: Publishes it }

rules:
  - id: apps-go-through-services
    deny: { from: { tag: app }, to: { kind: datastore } }
  - id: only-checkout-pays
    description: Only checkout talks to the payment provider.
    allow-only: { to: payment-provider, from: [checkout] }
  - id: no-personal-data-to-payments
    description: The payment provider gets amounts and tokens, not addresses.
    data: { classification: pii, not-sent-to: payment-provider }
