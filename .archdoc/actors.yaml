# Who uses ArchDoc.
actors:
  developer:
    kind: person
    description: Engineer of any experience level exploring, reviewing, or learning a system.
    uses:
      web:
        description: Explores the model, reviews diffs, follows tours and journeys
        sends: ExplorerAction
      cli:
        description: Validates, diffs, and checks the model locally
        sends: Command

  new-contributor:
    kind: role
    description: Someone opening their first PR to a repo they don't know yet.
    uses:
      web:
        description: Reads the explorer to learn how ArchDoc fits together
        sends: ExplorerAction

  maintainers:
    kind: team
    description: ArchDoc maintainers. Own every element and review model changes.
    members: ["@ArchDoc/maintainers"]
    uses:
      github-action: Reads architectural-impact comments on PRs

  architecture-team:
    kind: team
    description: Runs an org's landscape repo, which composes every team's model and adds enterprise teams, cross-team journeys, domains, and org rules.
    provenance: { source: suggested, by: agent:claude-code }
    uses:
      cli:
        description: Runs archdoc sync and archdoc landscape build in the landscape repo
        sends: Command
      landscape-template: Starts a landscape repo from the template

  coding-agent:
    kind: agent
    description: An AI coding agent (Claude Code, Cursor, Copilot, …) editing the codebase.
    uses:
      agent-skills:
        description: Reads the workflow from the skill or AGENTS.md
        sends: AgentInstructions
      mcp:
        description: Finds where a task starts and what it affects, checks its change, and updates the model with it
        technology: MCP (stdio)
        sends: ToolCall
      cli:
        description: Validates the model after editing it
        technology: archdoc --json
        sends: Command
