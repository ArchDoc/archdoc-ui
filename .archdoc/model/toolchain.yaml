# What ArchDoc is made of.
elements:
  github:
    kind: external
    description: Hosts the repository, pull requests, and Actions.
    uses:
      github-action: Runs on every pull request

  toolchain:
    kind: system
    description: The ArchDoc toolchain.
    owners: [maintainers]
    elements:
      spec:
        kind: container
        technology: TypeScript, Zod, JSON Schema
        description: Source of truth for the model format, its JSON Schema, and v1→v2 migration.
        code: [{ path: packages/spec/** }]
        elements:
          schema:
            kind: component
            description: Zod schema for model files, and the JSON Schema generated from it.
            code: [packages/spec/src/schema.ts, packages/spec/src/json-schema.ts]
          migrator:
            kind: component
            description: Converts v1 models (users, components) to v2 (actors, elements).
            code: [packages/spec/src/migrate.ts]
            uses:
              schema: Produces files that match the schema

      core:
        kind: container
        technology: TypeScript
        description: Deterministic engine. Loads, validates, queries, diffs, maps to code, checks rules.
        code: [{ path: packages/core/** }]
        uses:
          spec: Validates model files against the schema
          model-files: Reads the model
          analyzers:
            description: Collects observed architecture from source
            status: planned
        elements:
          loader:
            kind: component
            description: Multi-file loading, reference resolution, diagnostics with file and line.
            code: [{ path: packages/core/src/load/** }]
            uses:
              checker: Validates journeys once references resolve
          query:
            kind: component
            description: Element, actor, and overview queries. locate and impact come next.
            code: [{ path: packages/core/src/query/** }]
            uses:
              loader: Resolves references the same way the model does
          checker:
            kind: component
            description: Journey validation today. Drift detection and rule evaluation next.
            code: [{ path: packages/core/src/check/** }]
          differ:
            kind: component
            status: planned
            description: Semantic diff between two model revisions.
            code: [{ path: packages/core/src/diff/** }]

      analyzers:
        kind: container
        status: planned
        technology: TypeScript, dependency-cruiser
        description: Pluggable extractors of observed elements and dependencies.
        code: [{ path: packages/analyzers/** }]
        uses:
          source-tree: Reads manifests, imports, and infra files

      cli:
        kind: container
        technology: Node.js, commander
        description: "`archdoc` command: validate, view, migrate, and schema today; locate, impact, diff, check, and mcp next."
        code: [{ path: packages/cli/** }]
        uses:
          core: Commands delegate to core
          spec: Migrates v1 files and prints the JSON Schema
          web: Serves the explorer, the raw model files, and change events for `archdoc view`
        elements:
          commands:
            kind: component
            description: One module per command.
            code: [{ path: packages/cli/src/commands/** }]
          view-server:
            kind: component
            technology: node:http, fs.watch, server-sent events
            description: Localhost-only server for the explorer. Sends model files, not a built model, so the browser runs core itself.
            code: [packages/cli/src/server.ts]

      mcp:
        kind: container
        status: planned
        technology: Node.js, @modelcontextprotocol/sdk
        description: Exposes core queries and proposals as MCP tools and resources for agents.
        code: [{ path: packages/mcp/** }]
        uses:
          core: Tool calls delegate to core
          model-files:
            description: Writes suggested changes to the model
            status: planned

      web:
        kind: container
        technology: React 19, Vite, @xyflow/react, elkjs
        description: Explorer. Hierarchy, actor, and journey views today; diff overlay, code panel, and tours next.
        code: [{ path: apps/web/** }]
        uses:
          core: Builds and queries the model in the browser (@archdoc/core/browser)
        elements:
          model-loader:
            kind: component
            description: Fetches the model files and rebuilds the model on every change event.
            code: [{ path: apps/web/src/model/** }]
            uses:
              graph: Hands the model to the canvas
          graph:
            kind: component
            description: Decides what's visible (expand, focus, journeys), lifts relationships to visible boxes, and lays them out with ELK.
            code: [{ path: apps/web/src/graph/** }]
          ui:
            kind: component
            description: Canvas, sidebar, details panel, and journey stepper.
            code: [{ path: apps/web/src/components/**, description: Components }, apps/web/src/App.tsx]
            uses:
              graph: Renders the laid-out graph

      github-action:
        kind: container
        status: planned
        technology: GitHub Actions (Node)
        description: Posts an architectural-impact comment on PRs and optionally fails on drift.
        code: [{ path: integrations/github-action/** }]
        uses:
          core: Runs diff and check between the base and head revisions

      model-files:
        kind: datastore
        technology: YAML in git (.archdoc/)
        description: The human-owned architecture model, versioned with the code.
        code: [{ path: .archdoc/** }]

      source-tree:
        kind: datastore
        technology: Git working tree
        description: The code the model maps to.
