# What ArchDoc is made of.
elements:
  github:
    kind: external
    description: Hosts the repository, pull requests, and Actions.
    uses:
      github-action: Runs on every pull request

  toolchain:
    kind: system
    description: The ArchDoc toolchain.
    owners: [maintainers]
    elements:
      spec:
        kind: container
        technology: TypeScript, Zod, JSON Schema
        description: Source of truth for the model format, its JSON Schema, and v1→v2 migration.
        code: [{ path: packages/spec/** }]
        elements:
          schema:
            kind: component
            description: Zod schema for model files, and the JSON Schema generated from it.
            code: [packages/spec/src/schema.ts, packages/spec/src/json-schema.ts]
          migrator:
            kind: component
            description: Converts v1 models (users, components) to v2 (actors, elements).
            code: [packages/spec/src/migrate.ts]
            uses:
              schema: Produces files that match the schema

      core:
        kind: container
        technology: TypeScript
        description: Deterministic engine. Loads, validates, queries, diffs, maps to code, checks rules, and checks references into other repos.
        code: [{ path: packages/core/** }]
        uses:
          spec: Validates model files against the schema
          model-files: Reads the model
          source-tree: Lists repository files to map them to elements (git ls-files)
        elements:
          loader:
            kind: component
            description: Multi-file loading, reference resolution, diagnostics with file and line.
            code: [{ path: packages/core/src/load/** }]
            uses:
              checker: Validates journeys once references resolve
              imports:
                description: Loads archdoc.lock and the vendored models of other repos
                provenance: { source: suggested, by: agent:claude-code }
          query:
            kind: component
            description: Element, actor, and overview queries, search by words, and impact (consumers, actors, journeys, owners, rules, and consumers and journeys in other repos).
            code: [{ path: packages/core/src/query/** }]
            uses:
              imports:
                description: Adds consumers and journeys in other repos to impact
                provenance: { source: suggested, by: agent:claude-code }
              loader: Resolves references the same way the model does
              codemap: Turns a file path into its owning element
          codemap:
            kind: component
            description: Maps code to elements. locate (most specific owner wins), files per element, unmapped files, stale paths.
            code: [{ path: packages/core/src/codemap/** }]
          report:
            kind: component
            description: Text, JSON, and Mermaid answers shared by the CLI and MCP, so people and agents read the same words. Draws the PR report's diagrams of the change and its journeys.
            code: [{ path: packages/core/src/report/** }]
            uses:
              imports:
                description: Lists consumers and journeys in other repos, and what a change breaks
                provenance: { source: suggested, by: agent:claude-code }
              loader:
                description: Names contracts the same way the model checks them
                provenance: { source: suggested, by: agent:claude-code }
              query: Formats element, actor, overview, and impact results
              checker:
                description: Formats check findings
                provenance: { source: suggested, by: agent:claude-code }
              differ:
                description: Formats model diffs as text, markdown, and mermaid
                provenance: { source: suggested, by: agent:claude-code }
              codemap:
                description: Formats locate results
                provenance: { source: suggested, by: agent:claude-code }
          checker:
            kind: component
            description: Validates journeys, and compares the model with the code and its rules (undeclared dependencies, rule violations, stale paths, orphans).
            code: [{ path: packages/core/src/check/** }]
            uses:
              codemap:
                description: Maps observed file dependencies onto elements
                provenance: { source: suggested, by: agent:claude-code }
              loader:
                description: Resolves rule selectors and journey steps
                provenance: { source: suggested, by: agent:claude-code }
          differ:
            kind: component
            description: Semantic diff between two model revisions (actors, elements, relationships, journeys, data, rules).
            code: [{ path: packages/core/src/diff/** }]
          imports:
            kind: component
            description: Other repos' models. Packs and reads bundles, checks the lockfile and every reference, contract, and journey step into another repo at its pinned version, and indexes who uses this repo from the others (through the landscape).
            code: [{ path: packages/core/src/federation/** }]
            provenance: { source: suggested, by: agent:claude-code }
            uses:
              loader: Builds the models inside bundles, and checks contracts the same way

      analyzers:
        kind: container
        technology: TypeScript (ts.preProcessFile)
        description: Pluggable analyzers that find the dependencies code actually has (workspace manifests, TS/JS imports).
        code: [{ path: packages/analyzers/** }]
        uses:
          source-tree: Reads manifests, imports, and infra files
          core:
            description: Produces core's ObservedDependency records
            provenance: { source: suggested, by: agent:claude-code }

      federation:
        kind: container
        technology: Node.js, git, semver
        description: Shares models across repos. `sync` reads other repos' models (and the landscape, with every model it pins) at their release tags and vendors them, pinned in archdoc.lock; `publish` writes a versioned bundle.
        code: [{ path: packages/federation/** }]
        provenance: { source: suggested, by: agent:claude-code }
        uses:
          core: Builds and validates bundles, and reads the current lock
          spec: Reads and writes the lockfile and bundle formats
          model-files: Writes archdoc.lock and the bundles in .archdoc/vendor/
          other-repos: Lists release tags and reads the model at a tag

      cli:
        kind: container
        technology: Node.js, commander
        description: "`archdoc` command: validate, view, search, show, locate, impact, map, check, diff, report, sync, publish, mcp, migrate, and schema."
        code: [{ path: packages/cli/** }]
        uses:
          core: Commands delegate to core
          spec: Migrates v1 files and prints the JSON Schema
          web: Serves the explorer, the raw model files (and with --base, the files at a ref), and change events for `archdoc view`
          mcp: Starts the MCP server for `archdoc mcp`
          analyzers:
            description: Runs analyzers for `archdoc check`
            provenance: { source: suggested, by: agent:claude-code }
          federation:
            description: Runs `archdoc sync` and `archdoc publish`
            provenance: { source: suggested, by: agent:claude-code }
        elements:
          commands:
            kind: component
            description: One module per command.
            code: [{ path: packages/cli/src/commands/** }]
            uses:
              view-server:
                description: Starts the server for `archdoc view`
                provenance: { source: suggested, by: agent:claude-code }
          view-server:
            kind: component
            technology: node:http, fs.watch, server-sent events
            description: Localhost-only server for the explorer. Sends model files, not a built model, so the browser runs core itself.
            code: [packages/cli/src/server.ts]

      mcp:
        kind: container
        technology: Node.js, @modelcontextprotocol/sdk (stdio)
        description: MCP tools for agents. Read-only (search, overview, locate, impact, element, actor, journey, check, diff, validate), plus propose, which adds suggested facts to the model.
        code: [{ path: packages/mcp/** }]
        uses:
          core: Tool calls delegate to core
          model-files: Writes suggested additions and proposal notes for archdoc_propose
          analyzers:
            description: Runs analyzers for archdoc_check
            provenance:
              source: suggested
              by: agent:claude-code

      web:
        kind: container
        technology: React 19, Vite, @xyflow/react, elkjs
        description: Explorer. Hierarchy, actor, and journey views, a code panel with links, and a before/after view of model changes; tours next.
        code: [{ path: apps/web/** }]
        uses:
          core: Builds and queries the model in the browser (@archdoc/core/browser)
        elements:
          model-loader:
            kind: component
            description: Fetches the model files and rebuilds the model on every change event.
            code: [{ path: apps/web/src/model/** }]
            uses:
              graph: Hands the model to the canvas
          graph:
            kind: component
            description: Decides what's visible (expand, focus, journeys), lifts relationships to visible boxes, and lays them out with ELK.
            code: [{ path: apps/web/src/graph/** }]
          ui:
            kind: component
            description: Canvas, sidebar, details panel with code links, and journey stepper.
            code: [{ path: apps/web/src/components/**, description: Components }, apps/web/src/App.tsx]
            uses:
              graph: Renders the laid-out graph
              model-loader:
                description: Gets the model, files, and repository links
                provenance: { source: suggested, by: agent:claude-code }

      github-action:
        kind: container
        technology: GitHub Actions (composite), actions/github-script
        description: Posts an architectural-impact comment, with Mermaid diagrams of the change and its journeys, on pull requests and fails on drift they introduce.
        code: [{ path: integrations/github-action/** }]
        uses:
          cli:
            description: Runs archdoc report and archdoc check against the pull request's base
            provenance: { source: suggested, by: agent:claude-code }

      agent-skills:
        kind: container
        technology: Markdown (Claude Code skill, AGENTS.md), MCP configs
        description: Teaches coding agents the workflow. At the start of a task, search the model and check impact; afterwards, update the model with suggested facts and validate.
        code: [{ path: integrations/agent-skills/** }, .claude/**, AGENTS.md, CLAUDE.md, .mcp.json]
        uses:
          mcp: Points agents at the MCP tools

      model-files:
        kind: datastore
        technology: YAML in git (.archdoc/)
        description: The human-owned architecture model, versioned with the code.
        code: [{ path: .archdoc/** }]

      other-repos:
        kind: external
        description: Other teams' repositories whose models this one imports, read at their release tags.
        provenance: { source: suggested, by: agent:claude-code }

      source-tree:
        kind: datastore
        technology: Git working tree
        description: The code the model maps to.
