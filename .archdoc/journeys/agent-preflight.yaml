journey: agent-preflight
actor: coding-agent
goal: Know where a change sits in the architecture and what it affects, before editing
importance: critical
steps:
  - from: coding-agent
    to: agent-skills
    action: Reads the workflow from the skill, CLAUDE.md, or AGENTS.md
    code: integrations/agent-skills/claude-code/archdoc/SKILL.md
  - from: coding-agent
    to: mcp
    action: Calls archdoc_context with the task in a few words, or the files it plans to change, before grepping
    code: packages/mcp/src/server.ts
  - from: mcp
    to: analyzers
    action: Indexes the code's exported symbols and named imports
    code: packages/analyzers/src/symbols.ts
    sends: CodeIndex
  - from: mcp
    to: core
    action: Reloads the model and briefs the task, with the files and functions to open first, other code that does the same job, rules, journeys, tests, and owners
    code: packages/core/src/query/context.ts
    sends: CodeIndex
  - from: coding-agent
    to: mcp
    action: Calls archdoc_impact on those files
  - from: mcp
    to: core
    action: Walks consumers, actors, and journeys, and finds owners and rules
    code: packages/core/src/query/impact.ts
  - from: mcp
    to: coding-agent
    action: Returns the affected journeys and actors, which the agent names before editing
    sends: ToolResult
